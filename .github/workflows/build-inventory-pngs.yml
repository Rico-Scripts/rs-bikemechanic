name: Build Bike Mechanic inventory PNGs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-inventory-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render inventory images to PNG
        shell: bash
        run: |
          set -euo pipefail
          cd rs-bikemechanic/inventory_images
          for svg in *.svg; do
            png="${svg%.svg}.png"
            echo "Rendering $svg -> $png"
            rsvg-convert -w 512 -h 512 -o "$png" "$svg"
          done

      - name: Update ox_inventory mappings and README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          items = Path('rs-bikemechanic/ox_inventory_items.lua')
          text = items.read_text(encoding='utf-8')
          text = text.replace('.svg\'', '.png\'').replace('.svg"', '.png"')
          items.write_text(text, encoding='utf-8')

          readme = Path('rs-bikemechanic/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('SVG-bestanden', 'PNG-bestanden')
          text = text.replace('SVG bestanden', 'PNG bestanden')
          text = text.replace('`.svg`', '`.png`')
          text = text.replace('SVG', 'PNG')
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate all 17 inventory images
        shell: bash
        run: |
          set -euo pipefail
          files=(
            rs_bikemechanic_tablet
            rs_moto_engine_oil
            rs_moto_spark_plugs
            rs_moto_brake_pads
            rs_moto_chain
            rs_moto_tire_set
            rs_moto_battery
            rs_moto_clutch_cable
            rs_moto_turbo_kit
            rs_moto_ecu
            rs_moto_sport_exhaust
            rs_moto_race_brakes
            rs_moto_race_transmission
            rs_moto_sport_suspension
            rs_moto_antilag_software
            rs_moto_launch_control
            rs_moto_stage2_software
          )
          for name in "${files[@]}"; do
            test -s "rs-bikemechanic/inventory_images/${name}.png"
            grep -q "${name}.png" rs-bikemechanic/ox_inventory_items.lua
          done

      - name: Remove one-shot workflow and old SVG sources
        shell: bash
        run: |
          rm -f rs-bikemechanic/inventory_images/*.svg
          rm -f .github/workflows/build-inventory-pngs.yml

      - name: Commit generated PNG set to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Rico Scripts Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: replace Bike Mechanic inventory SVGs with PNG icons'
          git push origin HEAD:main
